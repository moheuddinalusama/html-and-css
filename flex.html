<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .container{
            display: flex;
            gap: 19px;
        }
        .container div{
            border: 1px solid tomato;
            height: 50px;
            width: 50px;
        }
        .card, .monu{
          display: flex;
          font-size: 2em;
             border: 2px solid;
             gap: 15px;
        }
    </style>
</head>
<body>
        <div class="container">
             <div>1</div>
             <div>2</div>
             <div>3</div>
             <div>4</div>
             <div>5</div>
             <div>6</div>

    </div>

   <div class="card">
    <div class="monu">monu1</div>
    <div class="monu">monu2</div>
    <div class="monu">monu3</div>
    <div class="monu">monu4</div>
    <div class="monu">monu5</div>
    <div class="monu">monu6</div>
</div>


</body>
</html>
